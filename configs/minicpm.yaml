method: sde_cctdh
seed: 18
dataset:
  split_group_key: source_id
  question_group_key: question_group
rpu:
  unavailable_pair_policy: skip
sde:
  steps: 64
  batch_size: 1
  gradient_accumulation_steps: 1
  basis_batch_size: 1
  lora:
    rank: 8
    alpha: 16
    dropout: 0.0
    layers: [28, 29, 30, 31, 32, 33, 34, 35]
    modules: [q_proj, k_proj, v_proj, o_proj]
  loss_weights:
    repair: 1.0
    protect: 1.0
    anchor: 1.0
  retention_basis:
    rank: 32
    seed: 18
  optimizer:
    learning_rate: 0.00005
    weight_decay: 0.0
    gradient_clip_norm: 1.0
cctdh:
  steps: 64
  batch_size: 1
  gradient_accumulation_steps: 1
  basis_batch_size: 1
  residual_lora:
    rank: 4
    alpha: 8
    dropout: 0.0
    layers: [28, 29, 30, 31, 32, 33, 34, 35]
    modules: [q_proj, k_proj, v_proj, o_proj]
  loss_weights:
    protect: 2.0
    anchor: 2.0
    detail_max: 0.015
  detail_warmup_steps: 8
  detail_norm_cap_ratio: 0.20
  retention_basis:
    rank: 32
    seed: 18
  optimizer:
    learning_rate: 0.00005
    weight_decay: 0.0
    gradient_clip_norm: 1.0
intervention:
  window_length: 4
  operators: [mask, replace]
  require_strict_target_superiority: true
routing:
  source_folds: 5
  seed: 18
  tie_order: [imagebind, muq, videomae]
teacher:
  hidden_layer: 34
  answer_position: response_start_minus_one
  latent_dim: 8
  ridge: 1.0
  require_fit_use_source_disjoint: true
preprocessing:
  max_slice_nums: 1
  max_input_length: 40960
  stack_frames: 1
  use_audio: true
  use_ffmpeg: false
