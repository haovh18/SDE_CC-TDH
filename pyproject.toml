[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-sde-cctdh"
version = "0.1.0"
description = "Paper-aligned core implementation of SDE and CC-TDH"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "torch>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
expert = [
  "scikit-learn>=1.3",
]
expert-extraction = [
  "muq==0.1.0",
  "torchaudio>=2.0",
  "transformers==4.46.3",
]
qwen = [
  "accelerate==1.2.1",
  "qwen-omni-utils==0.0.9",
  "transformers==4.51.3",
]
baseline = [
  "accelerate>=0.30",
  "huggingface-hub>=0.24",
  "qwen-omni-utils>=0.0.9",
  "requests>=2.31",
  "transformers>=4.51",
]
minicpm = [
  "gptqmodel>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-p no:cacheprovider"
